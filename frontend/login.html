<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>eMAR Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-shell">
    <div class="login-card">
        <h1>eMAR Login</h1>
        <p>Sign in with your username and password. Your username should start with <strong>adm</strong> for admin, <strong>med</strong> for staff, or <strong>res</strong> for residents/POA.</p>

        <form id="loginForm" class="form-grid">
            <div class="form-group full-width">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group full-width">
                <label for="tenantId">Tenant ID (optional)</label>
                <input type="text" id="tenantId" placeholder="Required only if your username/email exists in multiple tenants">
            </div>
            <div class="form-group full-width">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div id="loginError" class="error-text" style="display:none;"></div>
            <div class="form-actions full-width">
                <button type="submit" class="primary-btn">Login</button>
            </div>
        </form>
    </div>
</div>
<script src="login.js"></script>
</body>
</html>
