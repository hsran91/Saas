global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alert-rules.yml

scrape_configs:
  - job_name: emar-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:5000
    headers:
      x-metrics-token: replace_with_metrics_token